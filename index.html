<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suspensions — USCCS</title>
<style>
  :root { --navy: #11213F; --border: #E1E5EC; --bg: #F4F6FA; --gray: #5A6472; --danger: #C0392B; --success: #1F7A4D; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff; color: #1a1a1a;
  }
  h1 { font-size: 18px; margin: 0 0 4px; color: var(--navy); }
  p.muted { color: var(--gray); font-size: 13px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 8px 10px; background: var(--bg); border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--gray); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .status-active { color: var(--danger); font-weight: 600; }
  .status-cleared { color: var(--success); font-weight: 600; }
  .empty, .error { padding: 20px; text-align: center; color: var(--gray); font-size: 14px; }
</style>
</head>
<body>
  <h1>Current Suspensions</h1>
  <p class="muted">Red card suspensions across US College Club Soccer.</p>
  <div id="content"><div class="empty">Loading...</div></div>

  <script>
    async function load() {
      const content = document.getElementById('content');
      try {
        const res = await fetch('/api/suspensions');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load');
        render(data.suspensions || []);
      } catch (e) {
        content.innerHTML = '<div class="error">Unable to load suspensions right now.</div>';
      }
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function render(suspensions) {
      const content = document.getElementById('content');
      if (!suspensions.length) {
        content.innerHTML = '<div class="empty">No suspensions on record.</div>';
        return;
      }
      content.innerHTML = `
        <table>
          <thead><tr>
            <th>Player</th><th>Team</th><th>Games</th><th>Served</th><th>Status</th>
          </tr></thead>
          <tbody>
            ${suspensions.map(s => `
              <tr>
                <td>${escapeHtml(s.playerName)}</td>
                <td>${escapeHtml(s.teamName)}</td>
                <td>${escapeHtml(s.gamesRequired)}</td>
                <td>${escapeHtml(s.gamesServed)}</td>
                <td class="${s.eligible ? 'status-cleared' : 'status-active'}">${s.eligible ? 'Cleared' : 'Suspended'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    load();
  </script>
</body>
</html>
